services:
  database:
    image: postgis/postgis:13-master
    volumes:
      - ./data/database:/var/lib/postgresql/data:Z
    environment:
      POSTGRES_USER: "postgres.tscpipdhaljcmgalhsoc"
      POSTGRES_PASSWORD: "Gh0stik_1233"
      POSTGRES_DB: "aws-1-eu-west-3.pooler.supabase.com"
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=directus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  cache:
    image: redis:6
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  directus:
    image: directus/directus:latest
    ports:
      - 8055:8055
    volumes:
      - ./uploads:/directus/uploads:Z
      - ./extensions:/directus/extensions:Z
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8055/server/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    environment:
      SECRET: "REPLACE_WITH_YOUR_SECRET"

      DB_CLIENT: "pg"
      DB_HOST: "aws-1-eu-west-3.pooler.supabase.com"
      DB_PORT: "5432"
      DB_DATABASE: "postgres"
      DB_USER: "postgres.tscpipdhaljcmgalhsoc"
      DB_PASSWORD: "Gh0stik_1233"

      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"

      ADMIN_EMAIL: "waverest.official@gmail.com"
      ADMIN_PASSWORD: "qwerty_12"

      PUBLIC_URL: "http://127.0.0.1:8055"
